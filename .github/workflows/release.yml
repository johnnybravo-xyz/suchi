name: release

# Manual-only trigger. `git push --tags` does NOT fire this workflow —
# a human still has to click "Run workflow" in the GitHub UI or run
# `make release VERSION=vX.Y.Z` locally. The two-step cut:
#
#   1. git tag -s vX.Y.Z -m "suchi X.Y.Z"; git push origin vX.Y.Z
#   2. click "Run workflow" against ref=vX.Y.Z (or `make release
#      VERSION=vX.Y.Z`)
#
# The tag has to exist on origin first — the dispatch uses `ref` to
# check out the commit so every step downstream sees `github.ref_name
# = vX.Y.Z`. See docs/release-process.mdx for the full runbook.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (true) or artifacts-only smoke test (false)'
        required: false
        default: 'true'

permissions:
  contents: write   # write to the GitHub release
  packages: write   # push to ghcr.io
  id-token: write   # keyless cosign signing via OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # johnnybravo-xyz/suchi

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: verify candidate
        run: make check security-check TEST_FLAGS='-count=1 -timeout 60s'
      - name: validate publish ref
        if: inputs.publish == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "publishing requires a tag ref; got $REF_TYPE '$REF_NAME'" >&2
            exit 1
          fi

          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$REF_NAME" =~ $semver ]]; then
            echo "publishing requires a SemVer tag such as v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi

          version=${REF_NAME#v}
          without_build=${version%%+*}
          if [[ "$without_build" == *-* ]]; then
            prerelease=${without_build#*-}
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && "$identifier" != 0 ]]; then
                echo "numeric prerelease identifiers must not have leading zeroes: $identifier" >&2
                exit 1
              fi
            done
          fi

          if ! awk -v h="## [$version]" '
            $0 == h || index($0, h " - ") == 1 { found=1 }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "CHANGELOG.md must contain a matching '## [$version]' heading" >&2
            exit 1
          fi

          client_id=$(awk -F'"' '/^[[:space:]]*DefaultClientID = "/ { print $2; exit }' \
            core/ingest/emailwatch/oauth/microsoft.go)
          if [ -z "$client_id" ] || [ "$client_id" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "publishing requires the tested Suchi Microsoft public client ID" >&2
            exit 1
          fi

  # -------------------------------------------------------------------
  # notes: pull the section for this version out of CHANGELOG.md so
  # the release page carries the same prose as the file. Prereleases
  # skip `latest`; beta and RC releases receive their own
  # moving channel tags.
  # -------------------------------------------------------------------
  notes:
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      prerelease: ${{ steps.extract.outputs.prerelease }}
      channel:    ${{ steps.extract.outputs.channel }}
      artifact_version: ${{ steps.extract.outputs.artifact_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: extract
        run: |
          set -euo pipefail
          artifact_version="$GITHUB_REF_NAME"
          if [ "${{ inputs.publish }}" != "true" ]; then
            artifact_version="snapshot-${GITHUB_SHA:0:12}"
          fi
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          ver=${GITHUB_REF_NAME#v}
          echo "prerelease=$([[ "$ver" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          case "$ver" in
            *-beta*) echo "channel=beta" >> "$GITHUB_OUTPUT" ;;
            *-rc*)   echo "channel=rc" >> "$GITHUB_OUTPUT" ;;
            *)       echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

          # Published tags have a matching section, enforced by preflight.
          # Artifact-only branch runs use [Unreleased].
          awk -v h="## [$ver]" '
            $0 == h || index($0, h " - ") == 1 { flag=1; next }
            flag && /^## \[/                    { exit }
            flag                                { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "release notes for $ver are empty" >&2
              exit 1
            fi
            awk '/^## \[Unreleased\]/ { flag=1; next } flag && /^## \[/ { exit } flag { print }' \
              CHANGELOG.md > /tmp/notes.md
          fi
      # GitHub may suppress long job outputs that resemble a secret. The notes
      # are public changelog text; carry the file through the existing collector.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-notes
          path: /tmp/notes.md
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Build and sign both image variants for linux/amd64 and linux/arm64.
  # -------------------------------------------------------------------
  images:
    runs-on: ubuntu-latest
    needs: [notes, binaries, anydoc-binaries]
    outputs:
      standard_digest: ${{ steps.standard.outputs.digest }}
      full_digest: ${{ steps.full.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: anydoc-linux-*
          path: ${{ runner.temp }}/anydoc-artifacts
      - name: prepare AnyDoc image context
        env:
          ARTIFACT_VERSION: ${{ needs.notes.outputs.artifact_version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            bundle="anydoc-${ARTIFACT_VERSION}-linux-${arch}"
            target="$RUNNER_TEMP/anydoc/$arch"
            (
              cd "$RUNNER_TEMP/anydoc-artifacts/anydoc-linux-$arch"
              sha256sum -c "$bundle.tar.gz.sha256"
              mkdir -p "$target"
              tar -xzf "$bundle.tar.gz" -C "$target" --strip-components=1 \
                "$bundle/anydoc" "$bundle/LICENSE"
              test -s "$target/anydoc" && test -x "$target/anydoc"
              test -s "$target/LICENSE"
            )
          done
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        if: inputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        if: inputs.publish == 'true'
        with:
          cosign-release: v3.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: inputs.publish == 'true'
        with:
          syft-version: v1.51.0

      # The standard image owns the unsuffixed tags.
      - id: standard_tags
        run: |
          tags="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.artifact_version }}"
          if [ "${{ needs.notes.outputs.prerelease }}" = "false" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          elif [ "${{ needs.notes.outputs.channel }}" != "stable" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.channel }}"
            if [ "${{ needs.notes.outputs.channel }}" = "beta" ]; then
              tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta-standard"
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: build + push standard
        id: standard
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          target: standard
          build-contexts: anydoc=${{ runner.temp }}/anydoc
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == 'true' }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.notes.outputs.artifact_version }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=suchi-images
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-amd64
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-arm64
          cache-to: type=gha,scope=suchi-images,mode=max
          tags: ${{ steps.standard_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.notes.outputs.artifact_version }}
            org.opencontainers.image.licenses=AGPL-3.0

      - id: full_tags
        run: |
          tags="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.artifact_version }}-full"
          if [ "${{ needs.notes.outputs.prerelease }}" = "false" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-full"
          elif [ "${{ needs.notes.outputs.channel }}" != "stable" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.channel }}-full"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: build + push full
        id: full
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          target: full
          build-contexts: anydoc=${{ runner.temp }}/anydoc
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == 'true' }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.notes.outputs.artifact_version }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=suchi-images
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-amd64
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-arm64
          cache-to: type=gha,scope=suchi-images,mode=max
          tags: ${{ steps.full_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.notes.outputs.artifact_version }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: cosign sign images (keyless)
        if: inputs.publish == 'true'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.standard.outputs.digest }}
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.full.outputs.digest }}

      - name: SBOM (SPDX + CycloneDX)
        if: inputs.publish == 'true'
        run: |
          standard=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.artifact_version }}
          full=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.artifact_version }}-full
          syft "$standard" -o spdx-json --file suchi-standard.spdx.json
          syft "$standard" -o cyclonedx-json --file suchi-standard.cyclonedx.json
          syft "$full" -o spdx-json --file suchi-full.spdx.json
          syft "$full" -o cyclonedx-json --file suchi-full.cyclonedx.json

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: inputs.publish == 'true'
        with:
          name: sboms
          path: suchi-*.json

  # -------------------------------------------------------------------
  # binaries: cross-compile for the shipping matrix. Static (CGO_ENABLED=0)
  # so there's zero libc coupling on Linux. Ship a SHA256SUMS file so
  # downloaders can verify without invoking cosign.
  # -------------------------------------------------------------------
  binaries:
    runs-on: ubuntu-latest
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          ARTIFACT_VERSION: ${{ needs.notes.outputs.artifact_version }}
        run: |
          set -euo pipefail
          bin=suchi-${ARTIFACT_VERSION}-${GOOS}-${GOARCH}
          [ "$GOOS" = "windows" ] && bin=${bin}.exe
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${ARTIFACT_VERSION} -X main.revision=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/$bin" ./distro/cmd/suchi
          # emit a per-binary sha256 line (concatenated later)
          ( cd "$RUNNER_TEMP" && sha256sum "$bin" > "$bin.sha256" )
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/suchi-*

  # -------------------------------------------------------------------
  # anydoc-binaries: build the anydoc CLI from firecrawl/anydoc for the
  # bare-metal shipping matrix and attach the tarballs to the release.
  # Export the Dockerfile's anydoc target once per architecture; the image
  # job reuses these artifacts instead of compiling Rust a second time.
  #
  # Read the tag and audited commit only for the standalone NOTICE. The
  # Dockerfile owns the build recipe and all toolchain/source pins.
  # -------------------------------------------------------------------
  anydoc-binaries:
    runs-on: ubuntu-latest
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: arm64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: read anydoc pins from Dockerfile
        id: pin
        run: |
          set -euo pipefail
          tag=$(grep -oP 'ARG ANYDOC_TAG=\K[^\s]+' Dockerfile)
          commit=$(grep -oP 'ARG ANYDOC_COMMIT=\K[^\s]+' Dockerfile)
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "could not find anydoc pins in Dockerfile" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
      - name: build anydoc for ${{ matrix.platform }}
        env:
          ANYDOC_TAG: ${{ steps.pin.outputs.tag }}
          ANYDOC_COMMIT: ${{ steps.pin.outputs.commit }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_VERSION: ${{ needs.notes.outputs.artifact_version }}
        run: |
          set -euo pipefail
          docker buildx build --platform ${{ matrix.platform }} \
            --target anydoc --output type=local,dest=out .
          test -s "out/$ARCH/anydoc" && test -x "out/$ARCH/anydoc"
          test -s "out/$ARCH/LICENSE"
          # NOTICE for MIT attribution — required for a redistributed
          # MIT binary.
          cat > "out/$ARCH/NOTICE" <<EOF
          This anydoc build is redistributed from firecrawl/anydoc
          ${ANYDOC_TAG} (${ANYDOC_COMMIT}) under the MIT license. Source and full license
          text: https://github.com/firecrawl/anydoc
          EOF
          # Package tarball; version stamp comes from the release ref.
          bin="anydoc-${ARTIFACT_VERSION}-linux-${ARCH}"
          mv "out/$ARCH" "$RUNNER_TEMP/$bin"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${bin}.tar.gz" "$bin"
          ( cd "$RUNNER_TEMP" && sha256sum "${bin}.tar.gz" > "${bin}.tar.gz.sha256" )
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: anydoc-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/anydoc-*

  # -------------------------------------------------------------------
  # collect: aggregate binaries + SBOMs, generate the combined
  # SHA256SUMS + a cosign blob signature over it, then attach the
  # whole bundle to the GitHub release.
  # -------------------------------------------------------------------
  collect:
    runs-on: ubuntu-latest
    needs: [notes, images, binaries, anydoc-binaries]
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: /tmp/artifacts
          merge-multiple: true
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        if: inputs.publish == 'true'
        with:
          cosign-release: v3.1.2

      - name: aggregate SHA256SUMS
        working-directory: /tmp/artifacts
        run: |
          set -euo pipefail
          # per-binary .sha256 files already carry the "sum  file" line;
          # anydoc tarballs land alongside suchi binaries in the same
          # SHA256SUMS so a downloader gets one file to verify.
          cat suchi-*.sha256 anydoc-*.sha256 2>/dev/null | sort > SHA256SUMS
          rm -f suchi-*.sha256 anydoc-*.sha256

      - name: cosign sign the checksums file (blob signature)
        if: inputs.publish == 'true'
        working-directory: /tmp/artifacts
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: publish release
        # Manual dispatch only — publish when the operator explicitly
        # asks (`publish: true`, which is the default from the "Run
        # workflow" button). Set publish=false for artifacts-only
        # smoke runs against a branch.
        if: inputs.publish == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: suchi ${{ github.ref_name }}
          body_path: /tmp/artifacts/notes.md
          prerelease: ${{ needs.notes.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            /tmp/artifacts/suchi-*
            /tmp/artifacts/anydoc-*.tar.gz
            /tmp/artifacts/SHA256SUMS
            /tmp/artifacts/SHA256SUMS.cosign.bundle
            /tmp/artifacts/suchi-standard.spdx.json
            /tmp/artifacts/suchi-standard.cyclonedx.json
            /tmp/artifacts/suchi-full.spdx.json
            /tmp/artifacts/suchi-full.cyclonedx.json

# ---- Verification recipe (copied into the release notes footer by hand
# when we're happy with the shape; automate once it stabilizes) --------
#
# Verify an image was built by this workflow:
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/johnnybravo-xyz/suchi/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/johnnybravo-xyz/suchi:v0.1.0
#
# Verify a downloaded binary:
#   sha256sum -c SHA256SUMS
#   cosign verify-blob \
#     --bundle SHA256SUMS.cosign.bundle \
#     --certificate-identity-regexp 'https://github.com/johnnybravo-xyz/suchi/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     SHA256SUMS
