name: release

# Manual-only trigger. `git push --tags` does NOT fire this workflow —
# a human still has to click "Run workflow" in the GitHub UI or run
# `just release VERSION=vX.Y.Z` locally. The two-step cut:
#
#   1. git tag -s vX.Y.Z -m "suchi X.Y.Z"; git push origin vX.Y.Z
#   2. click "Run workflow" against ref=vX.Y.Z (or `just release
#      VERSION=vX.Y.Z`)
#
# The tag has to exist on origin first — the dispatch uses `ref` to
# check out the commit so every step downstream sees `github.ref_name
# = vX.Y.Z`. See docs/release-process.mdx for the full runbook.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (true) or artifacts-only smoke test (false)'
        required: false
        default: 'true'

permissions:
  contents: write   # write to the GitHub release
  packages: write   # push to ghcr.io
  id-token: write   # keyless cosign signing via OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # johnnybravo-xyz/suchi

jobs:
  # -------------------------------------------------------------------
  # notes: pull the section for this version out of CHANGELOG.md so
  # the release page carries the same prose as the file. Prerelease
  # Prereleases skip `latest`; beta and RC releases receive their own
  # moving channel tags.
  # -------------------------------------------------------------------
  notes:
    runs-on: ubuntu-latest
    outputs:
      body:       ${{ steps.extract.outputs.body }}
      prerelease: ${{ steps.extract.outputs.prerelease }}
      channel:    ${{ steps.extract.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: verify shipped Microsoft OAuth registration
        if: inputs.publish == 'true'
        run: |
          if grep -q 'DefaultClientID = "00000000-0000-0000-0000-000000000000"' \
            core/ingest/emailwatch/oauth/microsoft.go; then
            echo '::error::Register the shipped Entra app and replace DefaultClientID before releasing.'
            exit 1
          fi
      - id: extract
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          echo "prerelease=$([[ "$ver" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          case "$ver" in
            *-beta*) echo "channel=beta" >> "$GITHUB_OUTPUT" ;;
            *-rc*)   echo "channel=rc" >> "$GITHUB_OUTPUT" ;;
            *)       echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

          # Pull the section matching this version from CHANGELOG.md.
          # Falls through to the [Unreleased] block if a version-named
          # section isn't there yet (development cadence).
          awk -v v="$ver" '
            /^## \['"$ver"'\]/       { flag=1; next }
            flag && /^## \[/         { exit }
            flag                     { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            awk '/^## \[Unreleased\]/ { flag=1; next } flag && /^## \[/ { exit } flag { print }' \
              CHANGELOG.md > /tmp/notes.md
          fi
          {
            echo 'body<<END_NOTES'
            cat /tmp/notes.md
            echo 'END_NOTES'
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # Build and sign both image variants for linux/amd64 and linux/arm64.
  # -------------------------------------------------------------------
  images:
    runs-on: ubuntu-latest
    needs: notes
    outputs:
      standard_digest: ${{ steps.standard.outputs.digest }}
      full_digest: ${{ steps.full.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # The standard image owns the unsuffixed tags.
      - id: standard_tags
        run: |
          tags="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          if [ "${{ needs.notes.outputs.prerelease }}" = "false" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          elif [ "${{ needs.notes.outputs.channel }}" != "stable" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.channel }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: build + push standard
        id: standard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: standard
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == 'true' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.standard_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0

      - id: full_tags
        run: |
          tags="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-full"
          if [ "${{ needs.notes.outputs.prerelease }}" = "false" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-full"
          elif [ "${{ needs.notes.outputs.channel }}" != "stable" ]; then
            tags="$tags,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.notes.outputs.channel }}-full"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: build + push full
        id: full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == 'true' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.full_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: cosign sign images (keyless)
        if: inputs.publish == 'true'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.standard.outputs.digest }}
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.full.outputs.digest }}

      - name: SBOM (SPDX + CycloneDX)
        if: inputs.publish == 'true'
        run: |
          standard=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          full=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-full
          syft "$standard" -o spdx-json --file suchi-standard.spdx.json
          syft "$standard" -o cyclonedx-json --file suchi-standard.cyclonedx.json
          syft "$full" -o spdx-json --file suchi-full.spdx.json
          syft "$full" -o cyclonedx-json --file suchi-full.cyclonedx.json

      - uses: actions/upload-artifact@v4
        if: inputs.publish == 'true'
        with:
          name: sboms
          path: suchi-*.json

  # -------------------------------------------------------------------
  # binaries: cross-compile for the shipping matrix. Static (CGO_ENABLED=0)
  # so there's zero libc coupling on Linux. Ship a SHA256SUMS file so
  # downloaders can verify without invoking cosign.
  # -------------------------------------------------------------------
  binaries:
    runs-on: ubuntu-latest
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        working-directory: distro
        run: |
          set -euo pipefail
          bin=suchi-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}
          [ "$GOOS" = "windows" ] && bin=${bin}.exe
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$RUNNER_TEMP/$bin" ./cmd/suchi
          # emit a per-binary sha256 line (concatenated later)
          ( cd "$RUNNER_TEMP" && sha256sum "$bin" > "$bin.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/suchi-*

  # -------------------------------------------------------------------
  # anydoc-binaries: build the anydoc CLI from firecrawl/anydoc for the
  # bare-metal shipping matrix and attach the tarballs to the release.
  # The Dockerfile already builds this for the container images (standard
  # + full both COPY --from=anydoc-build) — this job produces the same
  # binary as a standalone artifact so users installing suchi from the
  # Go release binary can grab a matching anydoc.
  #
  # The anydoc tag, audited commit, and build image are grepped from the
  # Dockerfile so the container and standalone artifacts share one pin record.
  # -------------------------------------------------------------------
  anydoc-binaries:
    runs-on: ubuntu-latest
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: arm64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: read anydoc pins from Dockerfile
        id: pin
        run: |
          set -euo pipefail
          tag=$(grep -oP 'ARG ANYDOC_TAG=\K[^\s]+' Dockerfile)
          commit=$(grep -oP 'ARG ANYDOC_COMMIT=\K[^\s]+' Dockerfile)
          rust_image=$(grep -oP 'ARG RUST_IMAGE=\K[^\s]+' Dockerfile)
          if [ -z "$tag" ] || [ -z "$commit" ] || [ -z "$rust_image" ]; then
            echo "could not find anydoc pins in Dockerfile" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rust_image=$rust_image" >> "$GITHUB_OUTPUT"
      - name: build anydoc for ${{ matrix.platform }}
        env:
          ANYDOC_TAG: ${{ steps.pin.outputs.tag }}
          ANYDOC_COMMIT: ${{ steps.pin.outputs.commit }}
          RUST_IMAGE: ${{ steps.pin.outputs.rust_image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Mirror the Dockerfile anydoc-build stage exactly — same
          # base image, same commands. Emitting into a mount at
          # /host/out is the simplest way to hand the file back.
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/out:/host/out" \
            -e ANYDOC_TAG \
            -e ANYDOC_COMMIT \
            "$RUST_IMAGE" sh -c '
              set -eux
              apk add --no-cache git musl-dev pkgconfig
              mkdir /src && cd /src
              git init .
              git remote add origin https://github.com/firecrawl/anydoc.git
              git fetch --depth 1 origin "$ANYDOC_COMMIT"
              git checkout --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "$ANYDOC_COMMIT"
              cargo build --release --example convert
              strip target/release/examples/convert
              cp target/release/examples/convert /host/out/anydoc
              cp LICENSE /host/out/LICENSE 2>/dev/null || \
                cp LICENSE-MIT /host/out/LICENSE 2>/dev/null || true
            '
          # NOTICE for MIT attribution — required for a redistributed
          # MIT binary.
          cat > out/NOTICE <<EOF
          This anydoc build is redistributed from firecrawl/anydoc
          ${ANYDOC_TAG} (${ANYDOC_COMMIT}) under the MIT license. Source and full license
          text: https://github.com/firecrawl/anydoc
          EOF
          # Package tarball; version stamp comes from the release ref.
          bin="anydoc-${GITHUB_REF_NAME}-linux-${ARCH}"
          mkdir -p "$RUNNER_TEMP/$bin"
          mv out/* "$RUNNER_TEMP/$bin/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${bin}.tar.gz" "$bin"
          ( cd "$RUNNER_TEMP" && sha256sum "${bin}.tar.gz" > "${bin}.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: anydoc-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/anydoc-*

  # -------------------------------------------------------------------
  # collect: aggregate binaries + SBOMs, generate the combined
  # SHA256SUMS + a cosign blob signature over it, then attach the
  # whole bundle to the GitHub release.
  # -------------------------------------------------------------------
  collect:
    runs-on: ubuntu-latest
    needs: [notes, images, binaries, anydoc-binaries]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3

      - name: aggregate SHA256SUMS
        working-directory: /tmp/artifacts
        run: |
          set -euo pipefail
          # per-binary .sha256 files already carry the "sum  file" line;
          # anydoc tarballs land alongside suchi binaries in the same
          # SHA256SUMS so a downloader gets one file to verify.
          cat suchi-*.sha256 anydoc-*.sha256 2>/dev/null | sort > SHA256SUMS
          rm -f suchi-*.sha256 anydoc-*.sha256

      - name: cosign sign the checksums file (blob signature)
        working-directory: /tmp/artifacts
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS

      - name: publish release
        # Manual dispatch only — publish when the operator explicitly
        # asks (`publish: true`, which is the default from the "Run
        # workflow" button). Set publish=false for artifacts-only
        # smoke runs against a branch.
        if: inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: suchi ${{ github.ref_name }}
          body: ${{ needs.notes.outputs.body }}
          prerelease: ${{ needs.notes.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            /tmp/artifacts/suchi-*
            /tmp/artifacts/anydoc-*.tar.gz
            /tmp/artifacts/SHA256SUMS
            /tmp/artifacts/SHA256SUMS.cosign.bundle
            /tmp/artifacts/suchi-standard.spdx.json
            /tmp/artifacts/suchi-standard.cyclonedx.json
            /tmp/artifacts/suchi-full.spdx.json
            /tmp/artifacts/suchi-full.cyclonedx.json

# ---- Verification recipe (copied into the release notes footer by hand
# when we're happy with the shape; automate once it stabilizes) --------
#
# Verify an image was built by this workflow:
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/johnnybravo-xyz/suchi/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/johnnybravo-xyz/suchi:v0.1.0
#
# Verify a downloaded binary:
#   sha256sum -c SHA256SUMS
#   cosign verify-blob \
#     --bundle SHA256SUMS.cosign.bundle \
#     --certificate-identity-regexp 'https://github.com/johnnybravo-xyz/suchi/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     SHA256SUMS
