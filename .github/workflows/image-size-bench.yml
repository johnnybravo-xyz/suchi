name: image-size-bench

# One-off benchmark comparing three slim-image bases so we know the real
# cost of shipping pdftotext in the "default" image. Not a test — no
# assertions. Runs on demand (workflow_dispatch) so the CI budget isn't
# eaten by rebuilds on every push.
#
# Interpret the output: the "size_compressed_MB" column is what users
# actually download from the registry; "size_uncompressed_MB" is what
# lands on disk after a pull.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the Go binary once, share across variants
        run: |
          # Tag the build stage of the main Dockerfile so subsequent
          # variants can COPY --from=suchi-build:bench.
          docker build --target build -t suchi-build:bench .

      - name: Variant A — current slim (distroless/static, no pdftotext)
        run: |
          docker build --target slim -t suchi:slim-current .
          docker image inspect suchi:slim-current --format '{{.Size}}' > /tmp/size-A.raw
          echo "A: distroless/static  →  $(du -h --si <(docker image save suchi:slim-current) 2>/dev/null | cut -f1 || echo n/a) compressed layer read"

      - name: Variant B — distroless/base-debian12 + poppler-utils
        run: |
          cat > /tmp/Dockerfile.B <<'EOF'
          # Two-stage: apt-install into a debian:slim scratchpad, then
          # copy the runtime tree into distroless/base-debian12 (glibc,
          # same libc as our binary).
          FROM debian:bookworm-slim AS runtime-prep
          RUN apt-get update && apt-get install -y --no-install-recommends \
                poppler-utils ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          FROM gcr.io/distroless/base-debian12:nonroot AS slim-b
          COPY --from=runtime-prep /usr/bin/pdftotext /usr/bin/pdftotext
          COPY --from=runtime-prep /usr/lib/ /usr/lib/
          COPY --from=runtime-prep /etc/ssl/certs /etc/ssl/certs
          COPY --from=suchi-build:bench /out/suchi /suchi
          USER 65532:65532
          EXPOSE 8000
          VOLUME ["/data"]
          ENV DATA_DIR=/data LISTEN_ADDR=:8000
          ENTRYPOINT ["/suchi"]
          CMD ["serve"]
          EOF
          docker build -f /tmp/Dockerfile.B -t suchi:slim-b .
          docker image inspect suchi:slim-b --format '{{.Size}}' > /tmp/size-B.raw

      - name: Variant C — alpine + poppler-utils (musl)
        run: |
          cat > /tmp/Dockerfile.C <<'EOF'
          FROM alpine:3 AS slim-c
          RUN apk add --no-cache poppler-utils ca-certificates
          COPY --from=suchi-build:bench /out/suchi /usr/local/bin/suchi
          RUN adduser -D -u 65532 suchi && mkdir -p /data && chown 65532 /data
          USER 65532
          EXPOSE 8000
          VOLUME ["/data"]
          ENV DATA_DIR=/data LISTEN_ADDR=:8000
          ENTRYPOINT ["/usr/local/bin/suchi"]
          CMD ["serve"]
          EOF
          docker build -f /tmp/Dockerfile.C -t suchi:slim-c .
          docker image inspect suchi:slim-c --format '{{.Size}}' > /tmp/size-C.raw
          # Sanity check: can the binary actually run under Alpine's musl?
          # It was built CGO_ENABLED=0 so it should — one-shot invocation.
          docker run --rm --entrypoint /usr/local/bin/suchi suchi:slim-c version || \
            echo "WARN: variant C binary failed to run — musl mismatch?"

      - name: Variant D — alpine + full PDF chain (qpdf + poppler-utils + ocrmypdf + tesseract)
        run: |
          # Everything a PDF-only image needs: qpdf normalization,
          # pdftotext for the text-native shortcut, ocrmypdf + tesseract
          # for the scanned-PDF path. NO djvulibre, NO libreoffice.
          cat > /tmp/Dockerfile.D <<'EOF'
          FROM alpine:3 AS slim-d
          RUN apk add --no-cache \
                ca-certificates \
                qpdf \
                poppler-utils \
                ocrmypdf \
                tesseract-ocr \
                tesseract-ocr-data-eng
          COPY --from=suchi-build:bench /out/suchi /usr/local/bin/suchi
          RUN adduser -D -u 65532 suchi && mkdir -p /data && chown 65532 /data
          USER 65532
          EXPOSE 8000
          VOLUME ["/data"]
          ENV DATA_DIR=/data LISTEN_ADDR=:8000
          ENTRYPOINT ["/usr/local/bin/suchi"]
          CMD ["serve"]
          EOF
          docker build -f /tmp/Dockerfile.D -t suchi:slim-d .
          docker image inspect suchi:slim-d --format '{{.Size}}' > /tmp/size-D.raw
          docker run --rm --entrypoint /usr/local/bin/suchi suchi:slim-d version || \
            echo "WARN: variant D binary failed to run under musl"

      - name: Report
        run: |
          human() { awk -v b="$1" 'BEGIN { printf "%.1f MB\n", b/1024/1024 }'; }
          echo "=========================================================="
          echo "variant                                              size"
          echo "----------------------------------------------------------"
          printf "A  distroless/static  (current, no PDF tools)      %s\n" "$(human $(cat /tmp/size-A.raw))"
          printf "B  distroless/base-debian12 + poppler-utils         %s\n" "$(human $(cat /tmp/size-B.raw))"
          printf "C  alpine + poppler-utils                           %s\n" "$(human $(cat /tmp/size-C.raw))"
          printf "D  alpine + qpdf+poppler+ocrmypdf+tesseract (PDF)   %s\n" "$(human $(cat /tmp/size-D.raw))"
          echo "=========================================================="
          delta_b=$(( $(cat /tmp/size-B.raw) - $(cat /tmp/size-A.raw) ))
          delta_c=$(( $(cat /tmp/size-C.raw) - $(cat /tmp/size-A.raw) ))
          delta_d=$(( $(cat /tmp/size-D.raw) - $(cat /tmp/size-A.raw) ))
          printf "\ncost vs current 'slim':\n"
          printf "  B  +pdftotext (distroless base):    +%s\n" "$(human $delta_b)"
          printf "  C  +pdftotext (alpine):             +%s\n" "$(human $delta_c)"
          printf "  D  +full PDF chain (alpine):        +%s\n" "$(human $delta_d)"
