name: smoke

# End-to-end validation of the full ingest chain against the REAL
# external binaries (qpdf, ocrmypdf, pdftotext, tesseract). Runs on
# every push to main + on pull_request so a regression in the wrapper
# glue is caught before it lands.
#
# We build the Dockerfile "full" stage, boot the container with a
# throwaway data dir, walk the setup → upload → verify path via the
# HTTP API, and inspect the resulting documents row for real OCR
# output. Rationale: unit tests already cover the sandbox contract
# with fake binaries; this job is the only thing that catches a
# wrapper-vs-real-binary mismatch.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  full-image-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the full image
        run: |
          docker build \
              --target full \
              -t suchi:smoke .

      - name: Prepare a sample text-native PDF
        run: |
          # Build via Ghostscript from a hand-written PostScript source.
          # Deliberately avoids TeX Live (~5min apt install) so the whole
          # smoke workflow fits inside its 20-minute budget even when the
          # image build has to rebuild layers.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghostscript
          mkdir -p /tmp/samples
          cat > /tmp/samples/text-native.ps <<'EOF'
          %!PS-Adobe-3.0
          %%BoundingBox: 0 0 612 792
          /Helvetica findfont 14 scalefont setfont
          72 720 moveto (Electricity bill for March 2026.) show
          72 700 moveto (Total due 4523 rupees. BESCOM.) show
          showpage
          EOF
          ps2pdf /tmp/samples/text-native.ps /tmp/samples/text-native.pdf
          ls -la /tmp/samples/

      - name: Boot the container with a throwaway data dir
        run: |
          docker network create suchi-smoke-net
          docker run -d \
              --name suchi-smoke \
              --network suchi-smoke-net \
              -p 8000:8000 \
              -e PUBLIC_URL=http://127.0.0.1:8000 \
              -v suchi-smoke-data:/data \
              suchi:smoke
          # Wait for /healthz to answer 200. The container's own
          # HEALTHCHECK is 30s cadence — poll externally for speed.
          for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/healthz >/dev/null; then
                  echo "server up on attempt $i"
                  break
              fi
              sleep 1
          done
          curl -sf http://127.0.0.1:8000/readyz | tee /tmp/readyz.json

      - name: Bootstrap admin via /setup
        run: |
          TOKEN=$(docker logs suchi-smoke 2>&1 | grep 'token_minted' \
              | grep -oP '"token":"\K[^"]+' | head -1)
          if [ -z "$TOKEN" ]; then
              echo "setup token not found in logs"
              docker logs suchi-smoke
              exit 1
          fi
          curl -sf -X POST http://127.0.0.1:8000/setup \
              -H 'Content-Type: application/json' \
              -d "{\"token\":\"$TOKEN\",\"email\":\"smoke@ex.dev\",\"password\":\"pw\"}"
          echo "setup ok"

      - name: Login → API token
        run: |
          API_TOKEN=$(curl -s -X POST http://127.0.0.1:8000/api/login \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -d '{"username":"smoke@ex.dev","password":"pw"}' \
              | grep -oP '"token":"\K[^"]+')
          echo "API_TOKEN=$API_TOKEN" >> $GITHUB_ENV

      - name: Upload text-native PDF and wait for pipeline to finish
        run: |
          curl -sf -X POST http://127.0.0.1:8000/api/documents/ \
              -H "Authorization: Token $API_TOKEN" \
              -F "document=@/tmp/samples/text-native.pdf" \
              -o /tmp/upload.json
          cat /tmp/upload.json
          # Poll /api/tasks/?state=done for the doc's post-ingest job.
          for i in $(seq 1 60); do
              CNT=$(curl -sf "http://127.0.0.1:8000/api/tasks/?state=done&doc_id=1" \
                  -H "Authorization: Token $API_TOKEN" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('results') or []; print(len(r))")
              if [ "$CNT" -ge 1 ]; then
                  echo "post-ingest job done on attempt $i"
                  break
              fi
              sleep 1
          done
          if [ "$CNT" -lt 1 ]; then
              echo "post-ingest job never completed"
              docker logs suchi-smoke
              exit 1
          fi

      - name: Assert the pipeline ran the real binaries
        run: |
          # Full-image is distro-minimal — no sqlite3 CLI, no shell. Ask
          # the running server through its own HTTP surface instead.
          curl -sf "http://127.0.0.1:8000/api/documents/1" \
              -H "Authorization: Token $API_TOKEN" \
              -o /tmp/doc.json
          cat /tmp/doc.json
          LEN=$(python3 -c "import json; d=json.load(open('/tmp/doc.json')); print(len(d.get('content') or ''))")
          if [ "$LEN" -lt 20 ]; then
              echo "content too short ($LEN chars) — pipeline didn't run against real binaries"
              docker logs suchi-smoke | tail -50
              exit 1
          fi
          echo "content length = $LEN — pipeline OK"

          # Content must actually include the seed word so we know
          # pdftotext parsed the text-native PDF (not a spurious blob).
          if ! python3 -c "import json,sys; c=(json.load(open('/tmp/doc.json')).get('content') or '').lower(); sys.exit(0 if 'electricity' in c else 1)"; then
              echo "'electricity' missing from content — extraction regressed"
              exit 1
          fi
          echo "content contains 'electricity' — extraction OK"

      - name: Sanity-check the tasks + tags list endpoints return arrays
        run: |
          # Regression guard for the empty-list-null bug we hit on this
          # smoke workflow's first run — mobile clients depend on [].
          for path in "/api/tasks/?state=done&doc_id=1" "/api/tags/" "/api/rules/"; do
              curl -sf "http://127.0.0.1:8000$path" \
                  -H "Authorization: Token $API_TOKEN" \
                  | python3 -c "import json,sys; r=json.load(sys.stdin).get('results'); sys.exit(0 if isinstance(r, list) else 1)" \
                || (echo "$path did not return results:list"; exit 1)
              echo "$path OK"
          done

      - name: Grep the pipeline log for the routing decision
        run: |
          docker logs suchi-smoke 2>&1 | \
              grep -E 'qpdf\.|pdf-inspector\.|ocrmypdf\.|post-ingest\.route\.|view\.rendered' \
              | tail -20

      - name: Cleanup
        if: always()
        run: |
          docker logs suchi-smoke > /tmp/suchi.log 2>&1 || true
          docker rm -f suchi-smoke || true
          docker volume rm suchi-smoke-data || true
          docker network rm suchi-smoke-net || true

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-container-logs
          path: /tmp/suchi.log
