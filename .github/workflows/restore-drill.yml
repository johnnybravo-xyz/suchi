name: restore-drill

# A backup that was never opened is a hope, not a backup. This drill
# boots suchi against a fresh data dir, forces a VACUUM INTO snapshot,
# opens the snapshot with the sqlite3 CLI, and confirms
# PRAGMA integrity_check + PRAGMA user_version. Guards against
# silent breakage of the backup loop (schema drift, VACUUM INTO
# regression, half-written file on disk-full).
#
# Weekly cadence: the code paths this exercises only change when
# core/backup/* or the migrations set does — nightly runs would burn
# CI minutes to re-prove yesterday's answer. Sundays at 03:00 UTC
# lines up with the quietest window on most operators' clocks.
# Run manually from the Actions tab (workflow_dispatch) when a
# backup/migration/CAS-layout change lands and can't wait for the
# weekly tick.

on:
  schedule:
    - cron: "0 3 * * 0"   # Sundays 03:00 UTC
  workflow_dispatch:      # manual re-run from the Actions tab

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum

      - name: build suchi
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/suchi ./distro/cmd/suchi

      - name: install sqlite3 CLI
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sqlite3

      - name: seed data dir + trigger snapshot
        env:
          DATA_DIR: /tmp/suchi-nightly
          LISTEN_ADDR: 127.0.0.1:9876
          PUBLIC_URL: http://127.0.0.1:9876
          # 1-second interval so we don't wait 24h for the first tick.
          # BACKUP_KEEP=1 so the newest snapshot is the only survivor
          # — matches what the restore-drill wants to open.
          BACKUP_INTERVAL: 1s
          BACKUP_KEEP: "1"
          # Retention 100d so we don't accidentally exercise the prune
          # path during the seed loop.
          AUDIT_RETENTION_DAYS: "100"
        run: |
          mkdir -p "$DATA_DIR"
          /tmp/suchi serve &
          echo $! > /tmp/suchi.pid
          # Wait for /readyz. If it never comes up in 15s, fail loud.
          for i in {1..30}; do
            curl -sf http://127.0.0.1:9876/readyz && break
            sleep 0.5
          done
          # First backup tick fires 1s after start. Give it a couple
          # of intervals to write, then stop the server so we're not
          # opening a live WAL.
          sleep 3
          kill "$(cat /tmp/suchi.pid)"
          # Wait for exit + WAL checkpoint to flush.
          wait "$(cat /tmp/suchi.pid)" 2>/dev/null || true
          ls -la "$DATA_DIR/backups/" || (echo "no backups dir"; exit 1)

      - name: open + query the newest snapshot
        env:
          DATA_DIR: /tmp/suchi-nightly
        run: |
          # Newest suchi-*.db under backups/. Filename format is
          # suchi-<UTC-timestamp>.db (zero-padded, lex-sortable).
          NEWEST="$(ls -1 "$DATA_DIR"/backups/suchi-*.db | tail -n 1)"
          echo "opening $NEWEST"
          test -s "$NEWEST" || (echo "snapshot empty"; exit 1)
          # PRAGMA integrity_check must return "ok" — SQLite verifies
          # every page against its checksum and the b-tree invariants.
          RESULT="$(sqlite3 "$NEWEST" 'PRAGMA integrity_check;')"
          echo "integrity_check: $RESULT"
          test "$RESULT" = "ok" || (echo "integrity check failed"; exit 1)
          # suchi tracks migration state in PRAGMA user_version (see
          # core/db/migrate.go), not a schema_migrations table. A fresh-
          # migrated DB has user_version >= 1; a raw sqlite file with
          # no migrations reports 0.
          UV="$(sqlite3 "$NEWEST" 'PRAGMA user_version;')"
          echo "user_version: $UV"
          test "$UV" -ge 1 || (echo "no migrations in snapshot"; exit 1)
