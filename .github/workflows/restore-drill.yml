name: restore-drill

# Upload a real document, verify a database snapshot, then stop, copy, and
# restore the complete archive. Check original bytes and search after restart.
#
# Called by the manually dispatched checks workflow. It has no push,
# pull-request, or scheduled trigger of its own.

on:
  workflow_call:
    inputs:
      target_ref:
        description: 'Immutable revision to check out and validate'
        required: true
        type: string
permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1

      - name: build suchi
        run: |
          make ui
          CGO_ENABLED=0 go build -tags=embedded_ui -trimpath -o /tmp/suchi ./distro/cmd/suchi

      - name: install restore tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sqlite3 jq

      - name: restore and retrieve an uploaded document
        run: SUCHI_BIN=/tmp/suchi PORT=9876 bash hack/smoke-restore.sh
