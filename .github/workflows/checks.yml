name: checks

# Pushes and pull requests run the same complete validation graph maintainers can
# dispatch manually. Release publication remains a separate manual workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/ci.yml

  image-smoke:
    name: image smoke
    uses: ./.github/workflows/smoke.yml

  restore-drill:
    name: restore drill
    uses: ./.github/workflows/restore-drill.yml
