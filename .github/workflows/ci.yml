name: ci

on:
  workflow_call:

permissions:
  contents: read

# One runner per job walks the full module and target list sequentially.
# Fanning these out as matrices caused codeload.github.com to 429 on
# parallel setup-go downloads (12 concurrent fetches of the same tarball).
# Sequential in-runner loops keep total wall-clock similar while cutting
# the setup-go download count from 12 to 3.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: make vet
      - run: make test TEST_FLAGS='-count=1 -timeout 60s'

  build-cross:
    # Prove the code compiles for every shipping OS/arch. linux/amd64 is
    # already exercised by the `test` job (which builds distro), so we
    # skip it here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: cross-compile
        run: |
          set -e
          targets="linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for t in $targets; do
            export GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0
            echo "::group::$GOOS/$GOARCH"
            go build -trimpath -ldflags="-s -w" -o /tmp/suchi-$GOOS-$GOARCH ./distro/cmd/suchi
            ls -la /tmp/suchi-$GOOS-$GOARCH
            echo "::endgroup::"
          done

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: make ui-check
      - run: bunx playwright install --with-deps chromium
        working-directory: ui
      - run: make ui-e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: make fmt-check
      - run: make lint
