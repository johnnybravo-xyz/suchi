name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One runner per job walks the full module and target list sequentially.
# Fanning these out as matrices caused codeload.github.com to 429 on
# parallel setup-go downloads (12 concurrent fetches of the same tarball).
# Sequential in-runner loops keep total wall-clock similar while cutting
# the setup-go download count from 12 to 3.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: make vet
      - run: make test

  build-cross:
    # Prove the code compiles for every shipping OS/arch. linux/amd64 is
    # already exercised by the `test` job (which builds distro), so we
    # skip it here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: cross-compile
        run: |
          set -e
          targets="linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for t in $targets; do
            export GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0
            echo "::group::$GOOS/$GOARCH"
            go build -trimpath -ldflags="-s -w" -o /tmp/suchi-$GOOS-$GOARCH ./distro/cmd/suchi
            ls -la /tmp/suchi-$GOOS-$GOARCH
            echo "::endgroup::"
          done

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: make ui-check
      - run: bunx playwright install --with-deps chromium
        working-directory: ui
      - run: make ui-e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: make fmt-check
      - run: make lint
