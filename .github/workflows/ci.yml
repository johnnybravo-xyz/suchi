name: ci

on:
  workflow_call:
    inputs:
      target_ref:
        description: 'Immutable revision to check out and validate'
        required: true
        type: string
permissions:
  contents: read

# One runner per job walks the full module and target list sequentially.
# Fanning these out as matrices caused codeload.github.com to 429 on
# parallel setup-go downloads (12 concurrent fetches of the same tarball).
# Sequential in-runner loops keep total wall-clock similar while cutting
# the setup-go download count from 12 to 3.

jobs:
  ui-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: make ui-check
      - run: go test -count=1 ./core/uiassets ./core/ui
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spa-${{ inputs.target_ref }}
          path: core/ui/spa/dist
          if-no-files-found: error
          retention-days: 1

  test:
    needs: ui-assets
    env:
      GOFLAGS: -tags=embedded_ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: spa-${{ inputs.target_ref }}
          path: core/ui/spa/dist
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: make vet
      - run: make test TEST_FLAGS='-count=1 -timeout 180s'

  build-cross:
    # Prove the code compiles for every shipping OS/arch. linux/amd64 is
    # already exercised by the `test` job (which builds distro), so we
    # skip it here.
    runs-on: ubuntu-latest
    needs: ui-assets
    env:
      GOFLAGS: -tags=embedded_ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: spa-${{ inputs.target_ref }}
          path: core/ui/spa/dist
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: cross-compile
        run: |
          set -e
          targets="linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for t in $targets; do
            export GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0
            echo "::group::$GOOS/$GOARCH"
            go build -trimpath -ldflags="-s -w" -o /tmp/suchi-$GOOS-$GOARCH ./distro/cmd/suchi
            ls -la /tmp/suchi-$GOOS-$GOARCH
            echo "::endgroup::"
          done

  windows-dedup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: go test -count=1 -run '^TestConcurrentDuplicatePuts$' ./core/blob

  ui:
    runs-on: ubuntu-latest
    needs: ui-assets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bunx playwright install --with-deps chromium
        working-directory: ui
      - run: bun run e2e
        working-directory: ui

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: make fmt-check
      - run: make license-check
      - run: make docs-metadata-check
      - run: make lint
