# suchi — example configuration in YAML
#
# See docs/config.example.toml for the canonical example — TOML is
# suchi's recommended default. This YAML variant exists for operators
# with existing YAML tooling.
#
# CAVEAT: YAML has known parse gotchas (the "Norway problem" — bare
# `no` becomes a boolean false; sexagesimal times; `1.10` decimal-
# vs-string ambiguity). QUOTE STRING VALUES to be safe. TOML avoids
# all of these.
#
# Layered precedence (last wins):
#   1. this file
#   2. process env vars   ← env values override file values

public_url: "http://127.0.0.1:8000"

data_dir: "/data"
listen_addr: ":8000"
log_level: "info"
body_limit: "100M"
backup_interval: "24h"

ocr_languages: ["eng"]      # or "eng,deu" as a plain string
ocr_engine: "auto"
pdf_max_content_bytes: "8M"
epub_max_content_bytes: "32M"
djvu_max_content_bytes: "32M"

