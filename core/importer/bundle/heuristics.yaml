# suchi importer auto-heuristics — used when --auto-jd is set and the
# operator hasn't supplied --map-jd. Deterministic keyword matches against
# tag / correspondent / document_type / storage_path names, targeting the
# built-in Solo and Household filing trees, which share these codes. The
# importer refuses --auto-jd for any other tree. First rule wins; unmatched
# docs fall through to inbox.
#
# Bias: **high precision over recall**. Missing a category is fine (inbox
# is browsable + bulk-reassignable). Silently mis-filing to the wrong
# code is not fine — it hides docs from where the user expects them, so
# tags that span several categories (statement, gst, medical, license,
# registration, subscription, maintenance) are deliberately absent.
#
# All rule values are lowercased on match, so entries here should also be
# lowercase.
rules:
  # 20-29 Money
  - { if: tag:bank,              category: 21 }
  - { if: tag:banking,           category: 21 }
  - { if: tag:credit-card,       category: 21 }
  - { if: document_type:bank-statement, category: 21 }
  - { if: tag:investment,        category: 22 }
  - { if: tag:mutual-fund,       category: 22 }
  - { if: tag:sip,               category: 22 }
  - { if: tag:demat,             category: 22 }
  - { if: tag:portfolio,         category: 22 }
  - { if: tag:tax,               category: 23 }
  - { if: tag:taxes,             category: 23 }
  - { if: tag:itr,               category: 23 }
  - { if: tag:income-tax,        category: 23 }
  - { if: document_type:tax,     category: 23 }
  - { if: tag:loan,              category: 24 }
  - { if: tag:home-loan,         category: 24 }
  - { if: tag:warranty,          category: 25 }
  - { if: tag:purchase,          category: 25 }
  - { if: document_type:receipt, category: 25 }

  # 10-19 Life admin
  - { if: tag:passport,      category: 11 }
  - { if: tag:aadhaar,       category: 11 }
  - { if: tag:aadhar,        category: 11 }
  - { if: tag:pan,           category: 11 }
  - { if: tag:driver-license, category: 11 }
  - { if: tag:voter-id,      category: 11 }
  - { if: tag:insurance,     category: 12 }
  - { if: document_type:insurance, category: 12 }
  - { if: tag:vehicle,       category: 13 }
  - { if: tag:car,           category: 13 }
  - { if: tag:bike,          category: 13 }
  - { if: tag:motorcycle,    category: 13 }
  - { if: tag:membership,    category: 14 }
  - { if: tag:gym,           category: 14 }
  - { if: tag:education,     category: 15 }
  - { if: tag:school,        category: 15 }
  - { if: tag:university,    category: 15 }
  - { if: tag:tuition,       category: 15 }
  - { if: tag:salary,        category: 16 }
  - { if: tag:payslip,       category: 16 }
  - { if: document_type:payslip, category: 16 }

  # 30-39 Health
  - { if: document_type:medical-report, category: 31 }
  - { if: tag:prescription,  category: 32 }

  # 50-59 Home
  - { if: tag:electricity,   category: 51 }
  - { if: tag:water,         category: 51 }
  - { if: tag:gas,           category: 51 }
  - { if: tag:internet,      category: 51 }
  - { if: tag:broadband,     category: 51 }
  - { if: tag:phone,         category: 51 }
  - { if: tag:utility,       category: 51 }
  - { if: tag:utilities,     category: 51 }
  - { if: document_type:utility-bill, category: 51 }
  - { if: tag:rent,          category: 52 }
  - { if: tag:lease,         category: 52 }
  - { if: tag:mortgage,      category: 52 }
