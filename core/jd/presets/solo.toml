format = "suchi-taxonomy/v1"
id = "solo"
version = 1
name = "Solo filing"
license = "CC0-1.0"
market = "global"
language = "en"
story = "Personal records across life admin, money, health, and home."

[[areas]]
code = 10
name = "Life admin"

  [[areas.categories]]
  code = 11
  name = "Identity"
  description = "Identity cards, passports, and official identity records."
  keywords = ["passport", "aadhaar", "driver license", "national id"]

  [[areas.categories]]
  code = 12
  name = "Insurance"
  keywords = ["insurance policy", "premium", "sum insured", "policyholder"]

  [[areas.categories]]
  code = 13
  name = "Vehicles"
  keywords = ["vehicle registration", "driving licence", "rc book", "puc"]

  [[areas.categories]]
  code = 14
  name = "Education & memberships"
  keywords = ["certificate", "transcript", "membership", "course completion"]

[[areas]]
code = 20
name = "Money"

  [[areas.categories]]
  code = 22
  name = "Investments"
  keywords = ["mutual fund", "portfolio statement", "dividend", "demat"]

  [[areas.categories]]
  code = 23
  name = "Taxes"
  keywords = ["tax return", "form 16", "form 26as", "itr", "w-2", "1099"]

  [[areas.categories]]
  code = 24
  name = "Loans & credit"
  keywords = ["loan statement", "emi", "credit card statement"]

  [[areas.categories]]
  code = 25
  name = "Receipts"
  keywords = ["receipt", "invoice", "purchase order"]

[[areas]]
code = 30
name = "Health"

  [[areas.categories]]
  code = 31
  name = "Medical records"
  keywords = ["diagnosis", "medical report", "discharge summary"]

  [[areas.categories]]
  code = 32
  name = "Prescriptions"
  keywords = ["prescription", "pharmacy", "medicine"]

  [[areas.categories]]
  code = 33
  name = "Medical billing"
  keywords = ["hospital bill", "medical claim", "reimbursement"]

[[areas]]
code = 50
name = "Home"

  [[areas.categories]]
  code = 51
  name = "Utilities"
  keywords = ["electricity bill", "water bill", "gas bill", "internet bill", "broadband"]

  [[areas.categories]]
  code = 52
  name = "Housing"
  keywords = ["rent agreement", "lease", "mortgage", "property tax", "society maintenance"]

  [[areas.categories]]
  code = 54
  name = "Warranties"
  keywords = ["warranty", "guarantee", "proof of purchase"]

[seeds]

  [[seeds.automations]]
  name = "Solo: file utility bills"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)electricity bill|water bill|gas bill|internet bill|broadband"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 51

  [[seeds.automations]]
  name = "Solo: file tax documents"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)form 16|form 26as|income tax return|itr[- ]?[1-7]|form w-?2|form 1099"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 23

  [[seeds.automations]]
  name = "Solo: file insurance documents"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)insurance policy|premium|sum insured|policyholder|policy number"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 12

  [[seeds.automations]]
  name = "Solo: file prescriptions"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)prescription|rx no|dispensed|pharmacy"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 32

  [[seeds.automations]]
  name = "Solo: file medical bills"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)hospital bill|medical claim|reimbursement|discharge summary"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 33
