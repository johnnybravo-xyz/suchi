format = "suchi-taxonomy/v1"
id = "household"
version = 1
name = "Household"
license = "CC0-1.0"
market = "global"
language = "en"
story = "Shared family records across administration, money, health, and home."

[[areas]]
code = 10
name = "Family admin"

  [[areas.categories]]
  code = 11
  name = "Family IDs"
  description = "Identity records for adults and dependants."
  keywords = ["passport", "aadhaar", "birth certificate", "marriage certificate"]

  [[areas.categories]]
  code = 12
  name = "Insurance"
  keywords = ["insurance policy", "premium", "sum insured", "policyholder"]

  [[areas.categories]]
  code = 13
  name = "Vehicles"
  keywords = ["vehicle registration", "driving licence", "rc book", "puc"]

  [[areas.categories]]
  code = 14
  name = "Memberships"
  keywords = ["membership", "subscription", "club dues", "association"]

[[areas]]
code = 20
name = "Money"

  [[areas.categories]]
  code = 22
  name = "Investments"
  keywords = ["mutual fund", "portfolio statement", "dividend", "demat"]

  [[areas.categories]]
  code = 23
  name = "Taxes"
  keywords = ["tax return", "form 16", "form 26as", "itr", "w-2", "1099"]

  [[areas.categories]]
  code = 24
  name = "Loans & credit"
  keywords = ["loan statement", "emi", "credit card statement"]

  [[areas.categories]]
  code = 25
  name = "Receipts"
  keywords = ["receipt", "invoice", "purchase order"]

[[areas]]
code = 30
name = "Health"

  [[areas.categories]]
  code = 31
  name = "Medical records"
  keywords = ["diagnosis", "medical report", "discharge summary"]

  [[areas.categories]]
  code = 32
  name = "Prescriptions"
  keywords = ["prescription", "pharmacy", "medicine"]

  [[areas.categories]]
  code = 33
  name = "Medical billing"
  keywords = ["hospital bill", "medical claim", "reimbursement"]

[[areas]]
code = 50
name = "Home"

  [[areas.categories]]
  code = 51
  name = "Utilities"
  keywords = ["electricity bill", "water bill", "gas bill", "internet bill", "broadband"]

  [[areas.categories]]
  code = 52
  name = "Housing"
  keywords = ["rent agreement", "lease", "mortgage", "property tax", "society maintenance"]

  [[areas.categories]]
  code = 54
  name = "Warranties"
  keywords = ["warranty", "guarantee", "proof of purchase"]

[seeds]

  [[seeds.automations]]
  name = "Household: file utility bills"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)electricity bill|water bill|gas bill|internet bill|broadband"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 51

  [[seeds.automations]]
  name = "Household: file insurance documents"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)insurance policy|premium|sum insured|policyholder|policy number"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 12
