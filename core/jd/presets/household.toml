format = "suchi-taxonomy/v1"
id = "household"
version = 2
name = "Household"
license = "CC0-1.0"
market = "global"
language = "en"
story = "Shared family records across administration, money, health, and home."

[[areas]]
code = 10
name = "Family admin"

  [[areas.categories]]
  code = 11
  name = "Family IDs"
  description = "Identity records for adults and dependants: passports, national IDs, driving licences, birth and marriage certificates, visas."
  keywords = ["passport", "aadhaar", "national id", "voter id", "pan card", "driving licence", "driver license", "birth certificate", "marriage certificate"]

  [[areas.categories]]
  code = 12
  name = "Insurance"
  description = "Insurance policies, renewals, premium receipts and non-medical claims. Medical claims go to Medical billing."
  keywords = ["insurance policy", "policy schedule", "sum insured", "policyholder", "premium receipt"]

  [[areas.categories]]
  code = 13
  name = "Vehicles"
  description = "Vehicle registration, emission certificates, service records and the vehicle's purchase invoice."
  keywords = ["vehicle registration", "rc book", "puc certificate", "pollution under control"]

  [[areas.categories]]
  code = 14
  name = "Memberships & associations"
  description = "Clubs, gyms, professional bodies and alumni associations. Housing association charges go to Housing."
  keywords = ["membership card", "club membership", "gym membership", "professional membership", "alumni association", "club dues"]

  [[areas.categories]]
  code = 15
  name = "Education"
  description = "Degrees, marksheets, transcripts, school records, course certificates and fee receipts."
  keywords = ["degree certificate", "marksheet", "transcript", "report card", "course completion", "tuition fee"]

  [[areas.categories]]
  code = 16
  name = "Employment"
  description = "Payslips and offer, appointment, relieving and experience letters. Form 16 goes to Income tax."
  keywords = ["payslip", "salary slip", "offer letter", "appointment letter", "relieving letter", "experience letter"]

[[areas]]
code = 20
name = "Money"

  [[areas.categories]]
  code = 21
  name = "Bank & card statements"
  description = "Bank, credit card and debit card statements, and letters about those accounts."
  keywords = ["bank statement", "account statement", "statement of account", "credit card statement", "card statement"]

  [[areas.categories]]
  code = 22
  name = "Investments"
  description = "Mutual funds, shares, deposits and retirement savings such as PPF, EPF, NPS and 401(k)."
  keywords = ["mutual fund", "consolidated account statement", "portfolio statement", "demat"]

  [[areas.categories]]
  code = 23
  name = "Income tax"
  description = "Income tax returns, Form 16, W-2 and 1099 forms, tax payments and notices. Property tax goes to Housing."
  keywords = ["income tax return", "tax return", "form 16", "form 26as", "itr", "w-2", "1099"]

  [[areas.categories]]
  code = 24
  name = "Loans"
  description = "Loan statements, sanction letters, EMI schedules, interest certificates and closure letters. Mortgage agreements go to Housing."
  keywords = ["loan statement", "loan account", "sanction letter", "emi schedule", "mortgage statement", "loan closure"]

  [[areas.categories]]
  code = 25
  name = "Purchases & warranties"
  description = "Receipts, invoices and order confirmations for things you buy, plus warranty cards and manuals."
  keywords = ["purchase receipt", "order confirmation", "cash memo", "warranty card", "warranty certificate", "user manual"]

[[areas]]
code = 30
name = "Health"

  [[areas.categories]]
  code = 31
  name = "Medical records"
  description = "Diagnoses, lab and imaging reports, and discharge summaries."
  keywords = ["diagnosis", "medical report", "lab report", "discharge summary"]

  [[areas.categories]]
  code = 32
  name = "Prescriptions"
  description = "Prescriptions and medication instructions. Pharmacy bills go to Medical billing."
  keywords = ["prescription"]

  [[areas.categories]]
  code = 33
  name = "Medical billing"
  description = "Hospital and pharmacy bills, medical insurance claims and reimbursements."
  keywords = ["hospital bill", "pharmacy bill", "medical claim", "medical reimbursement"]

[[areas]]
code = 50
name = "Home"

  [[areas.categories]]
  code = 51
  name = "Utilities"
  description = "Electricity, water, gas, internet, phone and TV bills."
  keywords = ["electricity bill", "water bill", "gas bill", "internet bill", "broadband", "mobile bill"]

  [[areas.categories]]
  code = 52
  name = "Housing"
  description = "Ownership and title documents, leases, rent, mortgage agreements, property tax and association charges."
  keywords = ["sale deed", "title deed", "rent agreement", "lease agreement", "rent receipt", "mortgage agreement", "property tax", "society maintenance", "association dues"]

[seeds]

  [[seeds.automations]]
  name = "Household: file utility bills"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)electricity bill|water bill|gas bill|internet bill|broadband"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 51

  [[seeds.automations]]
  name = "Household: file insurance documents"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)insurance policy|sum insured|policyholder|policy number"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 12
