format = "suchi-taxonomy/v1"
id = "freelance"
version = 1
name = "Freelance / consultant"
license = "CC0-1.0"
market = "global"
language = "en"
story = "Client work, projects, money, compliance, and portfolio records for independent work."

[[areas]]
code = 10
name = "Clients"

  [[areas.categories]]
  code = 12
  name = "Quotes & contracts"
  keywords = ["quote", "proposal", "contract", "msa", "nda", "engagement letter"]

  [[areas.categories]]
  code = 13
  name = "Invoices out"
  keywords = ["invoice", "tax invoice", "credit note"]

  [[areas.categories]]
  code = 14
  name = "Collections & aging"
  keywords = ["receivable", "aging", "ageing", "outstanding", "past due", "remittance"]

  [[areas.categories]]
  code = 15
  name = "Correspondence"
  keywords = ["client letter", "client email", "meeting notes"]

[[areas]]
code = 20
name = "Projects"

  [[areas.categories]]
  code = 22
  name = "Briefs & plans"
  keywords = ["project brief", "project plan", "scope of work", "statement of work", "sow"]

  [[areas.categories]]
  code = 23
  name = "Costs & purchases"
  keywords = ["project expense", "purchase", "expense report"]

  [[areas.categories]]
  code = 24
  name = "Deliverables"
  keywords = ["deliverable", "asset pack", "handover"]

  [[areas.categories]]
  code = 25
  name = "Approvals & sign-off"
  keywords = ["completion certificate", "sign-off", "client approval", "acceptance"]

[[areas]]
code = 30
name = "Money"

  [[areas.categories]]
  code = 32
  name = "Expenses"
  keywords = ["expense report", "travel expense", "receipt"]

  [[areas.categories]]
  code = 33
  name = "Tax working papers"
  keywords = ["schedule c", "self-employment tax", "itr", "form 16", "form 26as"]

  [[areas.categories]]
  code = 34
  name = "Contractors"
  keywords = ["contractor agreement", "subcontractor", "freelancer agreement"]

  [[areas.categories]]
  code = 35
  name = "Contractor payments"
  keywords = ["contractor invoice", "contractor payment", "withholding"]

[[areas]]
code = 50
name = "Compliance"

  [[areas.categories]]
  code = 51
  name = "Tax filings"
  keywords = ["tax filing", "tax return", "gstr", "itr"]

  [[areas.categories]]
  code = 52
  name = "Statutory returns"
  keywords = ["statutory return", "annual return", "regulatory filing"]

  [[areas.categories]]
  code = 53
  name = "Audits"
  keywords = ["audit report", "auditor letter"]

  [[areas.categories]]
  code = 54
  name = "Licenses & permits"
  keywords = ["licence", "license", "permit", "registration certificate"]

[[areas]]
code = 60
name = "Portfolio & marketing"

  [[areas.categories]]
  code = 61
  name = "Case studies"
  keywords = ["case study", "portfolio piece"]

  [[areas.categories]]
  code = 62
  name = "Testimonials"
  keywords = ["testimonial", "reference letter"]

  [[areas.categories]]
  code = 63
  name = "Templates"
  keywords = ["template", "boilerplate"]

  [[areas.categories]]
  code = 64
  name = "Marketing assets"
  keywords = ["brochure", "brand asset", "campaign", "marketing plan"]

[seeds]

  [[seeds.automations]]
  name = "Freelance: file client contracts"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)master service agreement|statement of work|nda|engagement letter"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 12

  [[seeds.automations]]
  name = "Freelance: file outgoing invoices"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)tax invoice|invoice.*due|please remit"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 13

  [[seeds.automations]]
  name = "Freelance: file business expenses"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)expense report|reimbursement|receipt.*payment|paid by"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 32

  [[seeds.automations]]
  name = "Freelance: file tax working papers"
  [seeds.automations.trigger]
  type = 2
  filter_content_matching = "(?i)self[- ]?employment tax|schedule c|1099[- ]?nec|itr[- ]?4|advance tax"
  [[seeds.automations.actions]]
  kind = "assign_jd_category"
    [seeds.automations.actions.params]
    jd_category_code = 33
