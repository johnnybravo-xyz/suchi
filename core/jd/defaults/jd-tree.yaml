# suchi Johnny.Decimal starter tree.
#
# Deliberately boring. First boot loads this so a new install has a
# working tree on first ingest. Import another tree with
# `suchi taxonomy import`, or use flat mode.
#
# The 40-49 System area is reserved. Its 49 Inbox category is
# system=true — the UI/API refuse to delete it because low-confidence
# classifications land there and unclassifiable input needs a home.
areas:
  - start: 10
    end:   19
    name:  Life admin
    description: Identity, health, education, vehicles.
    categories:
      - { code: 11, name: Identity }
      - { code: 12, name: Health }
      - { code: 13, name: Education }
      - { code: 14, name: Vehicles }
      - { code: 15, name: Membership & subscriptions }

  - start: 20
    end:   29
    name:  Money
    description: Banking, tax, insurance, investments.
    categories:
      - { code: 21, name: Banking }
      - { code: 22, name: Tax }
      - { code: 23, name: Insurance }
      - { code: 24, name: Investments }
      - { code: 25, name: Salary & benefits }

  - start: 30
    end:   39
    name:  Home
    description: Property, utilities, purchases, warranties.
    categories:
      - { code: 31, name: Utilities }
      - { code: 32, name: Rent & mortgage }
      - { code: 33, name: Purchases & warranties }
      - { code: 34, name: Repairs & maintenance }

  - start: 40
    end:   49
    name:  System
    description: Templates, archive notes, and the inbox.
    categories:
      - { code: 41, name: Templates }
      - { code: 42, name: Archive notes }
      - { code: 49, name: Inbox, system: true }
