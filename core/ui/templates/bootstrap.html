{{define "bootstrap"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{{msg "auth.setup.title"}}</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/assets/brand/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/brand/favicon.ico">
  <link rel="stylesheet" href="/assets/vendor/oat.min.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body class="auth">
  <main class="login-card bootstrap-card">
    <span class="brand-hero" role="img" aria-label="suchi"></span>
    <h1 class="brand">{{msg "auth.setup.title"}}</h1>
    <p class="muted">{{msg "auth.setup.body"}}
      <code>localauth.setup.token_minted</code>. {{msg "auth.setup.body_suffix"}}</p>
    {{ if .Error }}<p class="error">{{ .Error }}</p>{{ end }}
    <form method="post" action="/bootstrap">
      <label>
        <span>{{msg "auth.setup.token"}}</span>
        <input name="token" type="text" required autofocus
               spellcheck="false" autocomplete="off"
               placeholder="{{msg "auth.setup.token_placeholder"}}">
      </label>
      <label>
        <span>{{msg "auth.setup.email"}}</span>
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label>
        <span>{{msg "auth.setup.display_name"}} <em class="muted">{{msg "auth.setup.optional"}}</em></span>
        <input name="display_name" type="text" autocomplete="name">
      </label>
      <label>
        <span>{{msg "auth.setup.password"}}</span>
        <input name="password" type="password" autocomplete="new-password"
               required minlength="8">
      </label>
      <button type="submit">{{msg "auth.setup.submit"}}</button>
    </form>
  </main>
</body>
</html>{{end}}
