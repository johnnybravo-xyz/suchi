{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ block "title" . }}{{ msg "nav.brand" }}{{ end }} · {{ msg "nav.brand" }}</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">{{ msg "nav.brand" }}</a>
    <nav>
      <a href="/">{{ msg "nav.documents" }}</a>
      <a href="/pending-decryption">{{ msg "nav.pending_decryption" }}</a>
    </nav>
    <div class="topbar-actions">
      <a class="btn btn-primary" href="/upload">+ {{ msg "nav.upload" }}</a>
      {{ if .Principal }}
        <div class="me">{{ .Principal.Email }}</div>
      {{ end }}
    </div>
  </header>
  <main>
    {{ block "content" . }}{{ end }}
  </main>
</body>
</html>{{end}}
