<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="suchi logo (open cabinet)">
  <!-- cabinet body, bottom drawer closed -->
  <rect x="14" y="9" width="36" height="47" rx="6" fill="none" stroke="#26251F" stroke-width="3.5"/>
  <line x1="14" y1="38" x2="50" y2="38" stroke="#26251F" stroke-width="3"/>
  <rect x="26" y="44.5" width="12" height="4.6" rx="2.3" fill="#26251F"/>
  <!-- folders peeking out of the open drawer (painted behind it) -->
  <rect x="19" y="11" width="9" height="9" rx="2.2" fill="#26251F"/>
  <rect x="32" y="4.5" width="13" height="15" rx="3" fill="#26251F"/>
  <!-- top drawer, pulled out (wider than the body) -->
  <rect x="9" y="18" width="46" height="17" rx="4.5" fill="none" stroke="#26251F" stroke-width="3.5"/>
  <rect x="25" y="24.6" width="14" height="4.8" rx="2.4" fill="#26251F"/>
</svg>