# nginx server block for suchi. Drop into /etc/nginx/sites-available/,
# symlink to /etc/nginx/sites-enabled/, edit hostname + TLS paths,
# `nginx -t && systemctl reload nginx`.
#
# TLS certificates come from wherever you already provision them
# (certbot / acme.sh / your load balancer). This file assumes the
# certs already exist at the paths below — replace them.

server {
    listen 80;
    listen [::]:80;
    server_name suchi.example.com;

    # Redirect all plaintext to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name suchi.example.com;

    ssl_certificate     /etc/letsencrypt/live/suchi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suchi.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Uploads. Suchi caps its own multipart size, so this only needs
    # to be at least as large as the largest doc you'll ingest.
    client_max_body_size 500M;

    # Suchi emits its own security headers. These add belt-and-braces
    # transport hardening. HSTS is a commit — leave it commented while
    # testing.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for OCR-driven upload responses. Suchi returns
        # the doc row synchronously; the OCR chain runs post-response
        # via the job outbox.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }
}
