# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "suchi-desktop"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
fs2 = "0.4"
hex = "0.4"
rand = "0.9"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-shell = "=2.5.0"
tauri-plugin-single-instance = "=2.5.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
